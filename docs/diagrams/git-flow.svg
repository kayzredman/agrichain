<svg xmlns="http://www.w3.org/2000/svg" width="920" height="160" viewBox="0 0 920 160" role="img">
  <style>
    .title { font: 600 15px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .sub { font: 400 12px Calibri, Segoe UI, sans-serif; fill: #52636B; }
    .chip { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #2D6A4F; }
    .head { font: 600 13px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .small { font: 400 11px Calibri, Segoe UI, sans-serif; fill: #1F2937; }
    .muted { font: 400 11px Calibri, Segoe UI, sans-serif; fill: #52636B; }
    .on { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .later { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #52636B; }
  </style>
  <rect width="920" height="160" fill="#ffffff"/>
  <rect x="46" y="28" width="180" height="78" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="60" y="50">1</text>
  <text class="title" x="78" y="50">Local dev</text>
  <text class="sub" x="60" y="76">Work and commit</text>
  <line x1="226" y1="67.0" x2="256" y2="67.0" stroke="#143228" stroke-width="1.25"/><polygon points="256,63.0 256,71.0 262,67.0" fill="#143228"/>
  <rect x="262" y="28" width="180" height="78" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="276" y="50">2</text>
  <text class="title" x="294" y="50">origin/dev</text>
  <text class="sub" x="276" y="76">Push after QA</text>
  <line x1="442" y1="67.0" x2="472" y2="67.0" stroke="#143228" stroke-width="1.25"/><polygon points="472,63.0 472,71.0 478,67.0" fill="#143228"/>
  <rect x="478" y="28" width="180" height="78" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="492" y="50">3</text>
  <text class="title" x="510" y="50">origin/main</text>
  <text class="sub" x="492" y="76">Same commit</text>
  <line x1="658" y1="67.0" x2="688" y2="67.0" stroke="#143228" stroke-width="1.25"/><polygon points="688,63.0 688,71.0 694,67.0" fill="#143228"/>
  <rect x="694" y="28" width="180" height="78" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="708" y="50">4</text>
  <text class="title" x="726" y="50">Local main</text>
  <text class="sub" x="708" y="76">Fast-forward</text>
  <text class="muted" x="460" y="140" text-anchor="middle">Then check out local dev again. main moves only by fast-forward.</text>
</svg>
