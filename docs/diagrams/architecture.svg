<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img">
  <style>
    .title { font: 600 15px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .sub { font: 400 12px Calibri, Segoe UI, sans-serif; fill: #52636B; }
    .chip { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #2D6A4F; }
    .head { font: 600 13px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .small { font: 400 11px Calibri, Segoe UI, sans-serif; fill: #1F2937; }
    .muted { font: 400 11px Calibri, Segoe UI, sans-serif; fill: #52636B; }
    .on { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .later { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #52636B; }
  </style>
  <rect width="720" height="340" fill="#ffffff"/>
  <rect x="80" y="16" width="560" height="78" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="title" x="96" y="44">Browser</text>
  <text class="sub" x="96" y="62">Coop, plant, buyer, authority, and the public claim. Staff sign with the organization key.</text>
  <line x1="360" y1="94" x2="360" y2="116" stroke="#143228" stroke-width="1.25"/><polygon points="356,116 364,116 360,122" fill="#143228"/>
  <rect x="80" y="122" width="560" height="78" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="title" x="96" y="150">Next.js service</text>
  <text class="sub" x="96" y="168">UI and /api/v1. Checks the session, signature, payload schema, lot head, and profile.</text>
  <line x1="360" y1="200" x2="360" y2="222" stroke="#143228" stroke-width="1.25"/><polygon points="356,222 364,222 360,228" fill="#143228"/>
  <rect x="80" y="228" width="272" height="96" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="title" x="96" y="256">Kernel tables</text>
  <text class="sub" x="96" y="274">Actors, places, lots, events, claims, alerts.</text>
  <rect x="368" y="228" width="272" height="96" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="title" x="384" y="256">Configuration</text>
  <text class="sub" x="384" y="274">Profiles, corridors, bands, checks, capability grants.</text>
</svg>
