<svg xmlns="http://www.w3.org/2000/svg" width="720" height="488" viewBox="0 0 720 488" role="img">
  <style>
    .title { font: 600 15px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .sub { font: 400 12px Calibri, Segoe UI, sans-serif; fill: #52636B; }
    .chip { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #2D6A4F; }
    .head { font: 600 13px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .small { font: 400 11px Calibri, Segoe UI, sans-serif; fill: #1F2937; }
    .muted { font: 400 11px Calibri, Segoe UI, sans-serif; fill: #52636B; }
    .on { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .later { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #52636B; }
  </style>
  <rect width="720" height="488" fill="#ffffff"/>
  <rect x="16" y="16" width="160" height="56" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="title" x="32" y="44">Kernel</text>
  <text class="sub" x="32" y="62">Same for every lot</text>
  <rect x="16" y="88" width="688" height="48" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.15"/>
  <text class="title" x="32" y="108">Custody</text>
  <text class="on" x="200" y="108">On</text>
  <text class="sub" x="32" y="126">Harvest, merge, consume, load, process, relabel</text>
  <rect x="16" y="144" width="688" height="48" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.15"/>
  <text class="title" x="32" y="164">Mass and yield</text>
  <text class="on" x="200" y="164">On</text>
  <text class="sub" x="32" y="182">Ceiling and balance checks. Bands come from the profile.</text>
  <rect x="16" y="200" width="688" height="48" rx="8" fill="#FFFFFF" stroke="#143228" stroke-width="1.15" stroke-dasharray="4 3"/>
  <text class="title" x="32" y="220">Credence</text>
  <text class="later" x="200" y="220">Later</text>
  <text class="sub" x="32" y="238">Inspect. Species or grade stays off until a lab passes.</text>
  <rect x="16" y="256" width="688" height="48" rx="8" fill="#FFFFFF" stroke="#143228" stroke-width="1.15" stroke-dasharray="4 3"/>
  <text class="title" x="32" y="276">Voyage</text>
  <text class="later" x="200" y="276">Later</text>
  <text class="sub" x="32" y="294">A call at an undeclared port opens an alert.</text>
  <rect x="16" y="312" width="688" height="48" rx="8" fill="#FFFFFF" stroke="#143228" stroke-width="1.15" stroke-dasharray="4 3"/>
  <text class="title" x="32" y="332">Inputs</text>
  <text class="later" x="200" y="332">Later</text>
  <text class="sub" x="32" y="350">A missing fertilizer or seed attestation lowers the ceiling.</text>
  <rect x="16" y="368" width="688" height="48" rx="8" fill="#FFFFFF" stroke="#143228" stroke-width="1.15" stroke-dasharray="4 3"/>
  <text class="title" x="32" y="388">Investigation</text>
  <text class="later" x="200" y="388">Later</text>
  <text class="sub" x="32" y="406">Export the lot path. Names and accounts stay outside.</text>
  <rect x="16" y="424" width="688" height="48" rx="8" fill="#FFFFFF" stroke="#143228" stroke-width="1.15" stroke-dasharray="4 3"/>
  <text class="title" x="32" y="444">Settlement</text>
  <text class="later" x="200" y="444">Later</text>
  <text class="sub" x="32" y="462">Release, and sharing of value kept at origin.</text>
</svg>
