<svg xmlns="http://www.w3.org/2000/svg" width="720" height="802" viewBox="0 0 720 802" role="img">
  <style>
    .title { font: 600 15px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .sub { font: 400 12px Calibri, Segoe UI, sans-serif; fill: #52636B; }
    .chip { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #2D6A4F; }
    .head { font: 600 13px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .small { font: 400 11px Calibri, Segoe UI, sans-serif; fill: #1F2937; }
    .muted { font: 400 11px Calibri, Segoe UI, sans-serif; fill: #52636B; }
    .on { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #143228; }
    .later { font: 600 11px Calibri, Segoe UI, sans-serif; fill: #52636B; }
  </style>
  <rect width="720" height="802" fill="#ffffff"/>
  <rect x="80" y="16" width="560" height="66" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="96" y="36">Coop clerk</text>
  <text class="title" x="96" y="56">Parcel</text>
  <text class="sub" x="96" y="74">Registers the season ceiling. The grower is a record, not a login.</text>
  <line x1="360" y1="82" x2="360" y2="98" stroke="#143228" stroke-width="1.25"/><polygon points="356,98 364,98 360,104" fill="#143228"/>
  <rect x="80" y="104" width="560" height="66" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="96" y="124">Coop clerk</text>
  <text class="title" x="96" y="144">Harvest</text>
  <text class="sub" x="96" y="162">Signs the event. The lot opens and biological origin is fixed.</text>
  <line x1="360" y1="170" x2="360" y2="186" stroke="#143228" stroke-width="1.25"/><polygon points="356,186 364,186 360,192" fill="#143228"/>
  <rect x="80" y="192" width="560" height="66" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="96" y="212">Coop clerk</text>
  <text class="title" x="96" y="232">Merge</text>
  <text class="sub" x="96" y="250">Signs the event. Several harvests become one lot. Inputs stay attached.</text>
  <line x1="360" y1="258" x2="360" y2="274" stroke="#143228" stroke-width="1.25"/><polygon points="356,274 364,274 360,280" fill="#143228"/>
  <rect x="80" y="280" width="560" height="66" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="96" y="300">Coop clerk</text>
  <text class="title" x="96" y="320">Transfer</text>
  <text class="sub" x="96" y="338">Names the plant as receiver. Custody has not moved yet.</text>
  <line x1="360" y1="346" x2="360" y2="362" stroke="#143228" stroke-width="1.25"/><polygon points="356,362 364,362 360,368" fill="#143228"/>
  <rect x="80" y="368" width="560" height="66" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="96" y="388">Coop clerk</text>
  <text class="title" x="96" y="408">Load</text>
  <text class="sub" x="96" y="426">Signs the event. The lot leaves the origin country.</text>
  <line x1="360" y1="434" x2="360" y2="450" stroke="#143228" stroke-width="1.25"/><polygon points="356,450 364,450 360,456" fill="#143228"/>
  <rect x="80" y="456" width="560" height="66" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="96" y="476">Plant clerk</text>
  <text class="title" x="96" y="496">Accept</text>
  <text class="sub" x="96" y="514">Signs on arrival. Custody moves here, and only here.</text>
  <line x1="360" y1="522" x2="360" y2="538" stroke="#143228" stroke-width="1.25"/><polygon points="356,538 364,538 360,544" fill="#143228"/>
  <rect x="80" y="544" width="560" height="66" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="96" y="564">Plant clerk</text>
  <text class="title" x="96" y="584">Process</text>
  <text class="sub" x="96" y="602">Signs the event. Outputs, declared loss, and the process country.</text>
  <line x1="360" y1="610" x2="360" y2="626" stroke="#143228" stroke-width="1.25"/><polygon points="356,626 364,626 360,632" fill="#143228"/>
  <rect x="80" y="632" width="560" height="66" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="96" y="652">Plant clerk</text>
  <text class="title" x="96" y="672">Pack</text>
  <text class="sub" x="96" y="690">Sets the packing expiry and mints the code the bag carries.</text>
  <line x1="360" y1="698" x2="360" y2="714" stroke="#143228" stroke-width="1.25"/><polygon points="356,714 364,714 360,720" fill="#143228"/>
  <rect x="80" y="720" width="560" height="66" rx="8" fill="#F4F7F5" stroke="#143228" stroke-width="1.25"/>
  <text class="chip" x="96" y="740">Derived</text>
  <text class="title" x="96" y="760">Claim</text>
  <text class="sub" x="96" y="778">Built from the events. No one edits it. Origin is not replaced.</text>
</svg>
